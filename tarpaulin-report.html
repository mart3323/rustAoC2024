o_fence_counts(plantmap: \u0026Plantmap) -\u003e Map\u003cusize\u003e {\n    let mut counts = plantmap.clone_with_default_value(9);\n    for pos in plantmap.enumerate() {\n      let expected_type = plantmap.get(\u0026pos);\n      let matches = plantmap.neighbors(\u0026pos).iter()\n          .filter(|n| plantmap.get(n) == expected_type).count();\n      counts.set(\u0026pos, 4-matches)\n    }\n    return counts;\n}\nfn to_side_counts(plantmap: \u0026Plantmap) -\u003e Map\u003cusize\u003e {\n    let mut counts = plantmap.clone_with_default_value(9);\n    for pos in plantmap.enumerate() {\n        let expected_type = plantmap.get(\u0026pos);\n        let is_same = |pos: Option\u003cPos\u003e| -\u003e bool {\n            pos.is_some_and(|p| { plantmap.pos_is_in_range(\u0026p) \u0026\u0026 plantmap.get(\u0026p) == expected_type })\n        };\n        let is_start_of_fence = |side: Option\u003cPos\u003e, before: Option\u003cPos\u003e, before_side:Option\u003cPos\u003e| -\u003e bool {\n            !is_same(side) \u0026\u0026 (!is_same(before) || is_same(before_side))\n        };\n        \n        let count =\n            usize::from(is_start_of_fence(pos.north(), pos.west(), pos.west().and_then(|p| p.north())))+\n            usize::from(is_start_of_fence(pos.east(), pos.north(), pos.north().and_then(|p| p.east())))+\n            usize::from(is_start_of_fence(pos.south(), pos.east(), pos.east().and_then(|p| p.south())))+\n            usize::from(is_start_of_fence(pos.west(), pos.south(), pos.south().and_then(|p| p.west())));\n        counts.set(\u0026pos, count)\n    }\n    return counts;\n}\n\nfn to_region_sizes(plantmap: \u0026Plantmap) -\u003e Map\u003cusize\u003e {\n    let mut visited = plantmap.clone_with_default_value(false);\n    let mut areas = plantmap.clone_with_default_value(0);\n    for pos in plantmap.enumerate() {\n        if *visited.get(\u0026pos) {\n            continue;\n        }\n        let mut collected = HashSet::new();\n        let mut front = HashSet::new();\n        front.insert(pos);\n        let expected_type = plantmap.get(\u0026pos);\n        while front.len() \u003e 0 {\n            front.iter().for_each(|pos| visited.set(pos, true));\n            let next_front = front.iter()\n                .flat_map(|p| plantmap.neighbors(p))\n                .filter(|p| !*visited.get(p))\n                .filter(|p| !collected.contains(p))\n                .filter(|p| plantmap.get(p) == expected_type)\n                .collect();\n            front.into_iter().for_each(|pos| {collected.insert(pos);});\n            front = next_front;\n        }\n        let area = collected.len();\n        collected.iter().for_each(|pos| {\n            areas.set(pos, area);\n        });\n    }\n    return areas;\n}\n\nfn get_fence_cost(plantmap: \u0026Plantmap) -\u003e usize {\n    let counts = to_fence_counts(\u0026plantmap);\n    let regions = to_region_sizes(\u0026plantmap);\n\n    let mut total = 0;\n    for pos in counts.enumerate() {\n        total += counts.get(\u0026pos) * regions.get(\u0026pos);\n    }\n    return total;\n}\nfn get_side_cost(plantmap: \u0026Plantmap) -\u003e usize {\n    let counts = to_side_counts(\u0026plantmap);\n    let regions = to_region_sizes(\u0026plantmap);\n\n    let mut total = 0;\n    for pos in counts.enumerate() {\n        total += counts.get(\u0026pos) * regions.get(\u0026pos);\n    }\n    return total;\n}\n\nfn parse(demo: \u0026str) -\u003e Plantmap {\n    Map::from(demo.lines().map(|l| l.chars().collect::\u003cVec\u003cchar\u003e\u003e()).collect::\u003cVec\u003cVec\u003cchar\u003e\u003e\u003e())\n}\n\n#[test]\nfn test_part1() {\n    let demo = read_input_file(DAY, \"demo.txt\");\n    let plantmap: Plantmap = parse(\u0026demo);\n    assert_eq!(get_fence_cost(\u0026plantmap), 1930)\n}\n\n\n#[test]\nfn test_part2() {\n    let plantmap: Plantmap = parse(\"AAAA\\nBBCD\\nBBCC\\nEEEC\");\n    assert_eq!(get_side_cost(\u0026plantmap), 80);\n    let plantmap: Plantmap = parse(\"EEEEE\nEXXXX\nEEE , y)| Vector2D{ x, y });\n    let line2 = (tag(\"Button B: X+\"), number, tag(\", Y+\"), number)\n        .map(|(_, x, _, y)| Vector2D{ x, y });\n    let line3 = (tag(\"Prize: X=\"), number, tag(\", Y=\"), number)\n        .map(|(_, x, _, y)| Vector2D{ x, y });\n\n    let newline = nom::character::complete::newline;\n    return (line1, newline, line2, newline, line3)\n        .map(|(button_a,_, button_b,_, goal)| ClawGame {goal, button_a, button_b})\n        .parse(str);\n}\nfn parse_claw_games(str: \u0026str) -\u003e IResult\u003c\u0026str, Vec\u003cClawGame\u003e\u003e {\n    let newline= nom::character::complete::newline;\n    return nom::multi::separated_list1((newline, newline), parse_claw_game)\n        .parse(str);\n}\n\nimpl ClawGame {\n    fn solve(\u0026self) -\u003e Option\u003cSolution\u003e {\n        let Vector2D { x: x1, y: y1 } = self.button_a;\n        let Vector2D { x: x2, y: y2 } = self.button_b;\n        let Vector2D { x: xt, y: yt } = self.goal;\n        \n        // k = (y2*xt - yt*x2) / (x1*y2 - x2*y1)\n        let a_presses = (y2*xt).abs_diff(yt*x2) / (x1*y2).abs_diff(x2*y1);\n        \n        let moved_x = x1 * a_presses;\n        if moved_x \u003e xt {\n            return None;\n        }\n        let b_presses = (xt - moved_x) / x2;\n        \n        if a_presses * x1 + b_presses * x2 == xt {\n            if a_presses * y1 + b_presses * y2 == yt {\n                return Some(Solution { a_presses, b_presses });\n            };\n        };\n        return None;\n    }\n}\n#[test]\nfn test_part1() {\n    let demo = read_input_file(DAY, \"demo.txt\");\n    let games = parse_claw_games(\u0026demo).unwrap().1;\n    let mut total = 0;\n    for game in games {\n        if let Some(solution) = game.solve() {\n            total += solution.get_cost();\n        }\n    }\n    assert_eq!(total, 480);\n}\n\n\npub fn part1() -\u003e usize {\n    let full = read_input_file(DAY, \"full.txt\");\n    let games = parse_claw_games(\u0026full).unwrap().1;\n d::fmt::Result {\n        write!(f, \"({},{})\", self.x, self.y)\n    }\n}\nstruct Robot {\n    position: Vector2D,\n    velocity: Vector2D,\n}\nimpl Display for Robot {\n    fn fmt(\u0026self, f: \u0026mut Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(f, \"Robot(p:{}, v:{})\", self.position, self.velocity)\n    }\n}\ntype Input = Vec\u003cRobot\u003e;\n\n\nfn parse_number(str: \u0026str) -\u003e IResult\u003c\u0026str, i64\u003e {\n    use nom::combinator::recognize;\n    use nom::combinator::opt as optional;\n    use nom::character::complete::digit1 as digit1;\n    use nom::character::complete::one_of;\n\n    recognize(\n    (optional(one_of(\"-\")), digit1)\n    ).map_res(str::parse).parse(str)\n}\nfn parse_vector(str: \u0026str) -\u003e IResult\u003c\u0026str, Vector2D\u003e {\n    use parse_number as number;\n    use nom::sequence::separated_pair;\n    use nom::bytes::complete::tag;\n\n    separated_pair(number, tag(\",\"), number)\n        .map(|(x, y)| Vector2D { x, y })\n        .parse(str)\n}\nfn parse_robot(str: \u0026str) -\u003e IResult\u003c\u0026str, Robot\u003e {\n    use nom::sequence::preceded;\n    use nom::sequence::separated_pair;\n    use nom::bytes::complete::tag;\n    use parse_vector as vector;\n\n    separated_pair(\n        preceded(tag(\"p=\"), vector),\n        tag(\" \"),\n        preceded(tag(\"v=\"), vector)\n    )\n        .map(|(position, velocity)| Robot { position, velocity })\n        .parse(str)\n}\nfn parse_input(str: \u0026str) -\u003e Result\u003cInput, nom::Err\u003cnom::error::Error\u003c\u0026str\u003e\u003e\u003e {\n    use nom::multi::separated_list1;\n    use nom::character::complete::newline;\n    use nom::combinator::all_consuming;\n    use parse_robot as robot;\n\n    Ok(all_consuming(separated_list1(newline, robot)).parse(str)?.1)\n}\nfn safety_factor_after_n_seconds(input: \u0026Input, seconds: u64, width: i128, height: i128) -\u003e u128 {\n    use std::cmp::Ordering::{Greater, Less};\n    let mut q1: u128 = 0;\n    let mut q2: u128 = 0;\n    let mut q3: u128 = 0;\n    let mut q4: u128 = 0;\n    for robot in input {\n        // i64 -\u003e i128 = safe\n        // and robots are always within a 101x103 square anyway\n        let start_x = robot.position.x as i128;\n        let start_y = robot.position.y as i128;\n        // multiplication is checked, modulus can only make the number smaller\n        let mod_dx = ((robot.velocity.x as i128 % width)).checked_mul(seconds as i128).expect(\"Overflow for dx\") % width;\n        let mod_dy = ((robot.velocity.y as i128 % height)).checked_mul(seconds as i128).expect(\"Overflow for dy\") % height;\n        // start position is small (within 0..103), width and height are 101,103, no chance of overflow for i128\n        let mut end_x = (start_x + mod_dx) % (width);\n        let mut end_y = (start_y + mod_dy) % (height);\n\n        while end_x \u003c 0 {\n            end_x += width;\n        }\n        while end_y \u003c 0 {\n            end_y += height;\n        }\n        match (end_x.cmp(\u0026(width/2)), end_y.cmp(\u0026(height/2))) {\n            (Greater, Greater) =\u003e {q1 += 1;},\n            (Greater, Less) =\u003e {q2 += 1;},\n            (Less, Greater) =\u003e {q3 += 1;},\n            (Less, Less) =\u003e {q4 += 1},\n            _ =\u003e {\n                // Robot is exactly in the middle on at least one axis, does not contribute to safety\n            }\n        }\n    }\n    return q1 * q2 * q3 * q4;\n}\nimpl Robot {\n    fn run_n_seconds(\u0026mut self, seconds: usize, width: usize, height: usize) {\n        let Vector2D{mut x,mut y} = self.position;\n        let Vector2D{x: dx,y: dy} = self.velocity;\n        for _ in 0..seconds {\n            x = (x + dx) % (width as i64);\n            y = (y + dy) % (height as i64);\n        }\n        while x \u003c 0 {\n            x += width as i64;\n        }\n        while y \u003c 0 {\n            y += height as i64;\n        }\n        self.position = Vector2D { x, y };\n    }\n}\nfn sim_iter(robot: \u0026Robot, seconds: u64, width: i64, height: i64) -\u003e (i128, i128) {\n    let Vector2D{mut x,mut y} = robot.position;\n    for _ in 0..seconds {\n        x = (x + robot.velocity.x) % width;\n        y = (y + robot.velocity.y) % height;\n    }\n    while x \u003c 0 {\n        x += width;\n    }\n    while y \u003c 0 {\n        y += height;\n    }\n    return (x as i128, y as i128)\n}\n#[test]\nfn test_part1() {\n    let demo = read_input_file(DAY, \"demo.txt\");\n    let robots = parse_input(\u0026demo);\n    match robots {\n        Err(e) =\u003e panic!(\"Failed to parse robots: {}\", e),\n        Ok(robots) =\u003e {\n            let safety_factor = safety_factor_after_n_seconds(\u0026robots, 100, 11, 7);\n            assert_eq!(safety_factor, 12);\n        }\n    }\n}\n#[test]\nfn test_part1_wrong_submissions() {\n    let full = read_input_file(DAY, \"full.txt\");\n    let robots = parse_input(\u0026full);\n    match robots {\n        Err(e) =\u003e panic!(\"Failed to parse robots: {}\", e),\n        Ok(robots) =\u003e {\n            println!(\"{}\", robots.last().unwrap());\n            let found = safety_factor_after_n_seconds(\u0026robots, 100, 101, 103);\n            println!(\"{:?}\", found);\n            assert!(found \u003c 226839600);\n            assert!(110149200 \u003c found);\n        }\n    }\n}\n#[test]\nfn test_part2_iter_method_works() {\n    let full = read_input_file(DAY, \"full.txt\");\n    let robots = parse_input(\u0026full).unwrap();\n    let expected = safety_factor_after_n_seconds(\u0026robots, 100, 101, 103);\n\n    println!(\"{}\", robots.first().unwrap());\n    let mut robots = robots;\n    for x in (0..10) {\n        robots.iter_mut().for_each(|robot| robot.run_n_seconds(1, 101, 103))\n    }\n    println!(\"{}\", robots.first().unwrap());\n    let actual = safety_factor_after_n_seconds(\u0026robots, 100-10, 101, 103);\n    assert_eq!(expected, actual);\n    robots.iter_mut().for_each(|robot| robot.run_n_seconds(10, 101, 103));\n    robots.iter_mut().for_each(|robot| robot.run_n_seconds(10, 101, 103));\n    let actual = safety_factor_after_n_seconds(\u0026robots, 100-10-20, 101, 103);\n    assert_eq!(expected, actual);\n}\n\npub fn part1() -\u003e u128 {\n    let full = read_input_file(DAY, \"full.txt\");\n    let robots = parse_input(\u0026full);\n    match robots {\n        Err(e) =\u003e panic!(\"Failed to parse robots: {}\", e),\n        Ok(robots) =\u003e {\n            return safety_factor_after_n_seconds(\u0026robots, 100, 101, 103);\n        }\n    }\n}\npub fn part2() -\u003e u128 {\n    const WIDTH: usize = 101;\n    const HEIGHT: usize = 103;\n    let full = read_input_file(DAY, \"full.txt\");\n    let robots = parse_input(\u0026full);\n    match robots {\n        Err(e) =\u003e panic!(\"Failed to parse robots: {}\", e),\n        Ok(mut robots) =\u003e {\n            for i in 1..10000 {\n                robots.iter_mut().for_each(|r| r.run_n_seconds(1, 101, 103));\n                println!(\"{} seconds have elapsed:\", i);\n\n                // a default (black) image containing Rgb values\n                let mut image = GrayImage::new(WIDTH as u32, HEIGHT as u32);\n\n                for r in \u0026robots {\n                    let pixel = image.get_pixel_mut(r.position.x as u32, r.position.y as u32);\n                    pixel.0[0] = 255;\n                }\n                // write it out to a file\n                fs::create_dir(\"src/day14/images\"); // if it fails, assumje dir already exists\n                image.save(format!(\"src/day14/images/{}.png\", i)).unwrap();\n\n            }\n            0\n        }\n    }\n}\n\n\n\nfn display_map(robots: \u0026Input, width: i64, height: i64) {\n    for y in 0..height {\n        for x in 0..width {\n            match robots.iter().filter(|r| r.position == Vector2D { x, y }).count() {\n                0 =\u003e print!(\".\"),\n                n if 0 \u003c= n \u0026\u0026 n \u003c= 9 =\u003e print!(\"{}\", n),\n                _ =\u003e print!(\"#\")\n            }\n        }\n        println!();\n    }\n}\n\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","Reigo","RustroverProjects","AoC2024","src","day15","mod.rs"],"content":"use std::collections::HashSet;\nuse nom::Parser;\nuse std::fmt::{Display, Formatter};\nuse std::io::Read;\nuse std::num::TryFromIntError;\nuse std::str::FromStr;\nuse log::LevelFilter::Off;\nuse crate::day15::parsers::parse_input;\nuse crate::day15::types::{Direction, Point, Tile, Warehouse};\nuse crate::utils::read_input_file;\n\nmod types;\nmod parsers;\n\nconst DAY: \u0026str = \"day15\";\n\n\nstruct Offset {\n    col: isize,\n    row: isize,\n}\n#[derive(Eq, PartialEq, Clone, Copy, Debug, Hash)]\nstruct Pos {col: isize, row: isize}\nimpl Pos {\n    fn offset_to(\u0026self, other: \u0026Self) -\u003e Offset {\n        Offset{\n            col: other.col - self.col,\n            row: other.row - self.row,\n        }\n    }\n    fn apply_offset(\u0026self, offset: \u0026Offset) -\u003e Self {\n        Self {\n            col: self.col + offset.col,\n            row: self.row + offset.row\n        }\n    }\n    fn apply_offset_times(\u0026self, offset: \u0026Offset, times: isize) -\u003e Self {\n        Self {\n            col: self.col + (times * offset.col),\n            row: self.row + (times * offset.row),\n        }\n    }\n    /// (col, row)\n    fn as_usize_pair(self) -\u003e Result\u003c(usize, usize), TryFromIntError\u003e {\n        let col = usize::try_from(self.col)?;\n        let row = usize::try_from(self.row)?;\n        Ok((col, row))\n    }\n}\n#[derive(Clone)]\nstruct Map2D\u003cT\u003e where T: Display{\n    map: Vec\u003cT\u003e,\n    width: usize,\n    height: usize,\n}\n\nenum Error { OutOfBounds }\nimpl\u003cT: Display\u003e Map2D\u003cT\u003e {\n    /// Returns the given position as a map index, ONLY IF the position is within the bounds of the map\n    fn as_index(\u0026self, pos: \u0026Pos) -\u003e Option\u003cusize\u003e {\n        if 0 \u003c= pos.col \u0026\u0026 pos.col \u003c= self.width as isize \u0026\u0026\n            0 \u003c= pos.row \u0026\u0026 pos.row \u003c= self.height as isize {\n            Some((pos.col + (self.width as isize * pos.row)) as usize)\n        } else {\n            None\n        }\n    }\n    fn as_pos(\u0026self, index: usize) -\u003e Pos {\n        Pos {\n            row: (index / self.width) as isize,\n            col: (index % self.width) as isize,\n        }\n    }\n    fn try_set_cell(\u0026mut self, pos: \u0026Pos, cell: T) -\u003e Result\u003c(), ()\u003e {\n        let index = self.as_index(pos);\n        if let Some(index) = index {\n            self.map[index] = cell;\n            return Ok(())\n        }\n        return Err(())\n    }\n    fn get_cell(\u0026self, pos: \u0026Pos) -\u003e Option\u003c\u0026T\u003e {\n        let i = self.as_index(pos)?;\n        self.map.get(i)\n    }\n    fn set_cell(\u0026mut self, pos: \u0026Pos, cell: T) -\u003e Result\u003c(), ()\u003e {\n        let index = self.as_index(pos).ok_or(())?;\n        self.map[index] = cell;\n        Ok(())\n    }\n    fn update_cell(\u0026mut self, pos: \u0026Pos, update: fn(\u0026T) -\u003e T) -\u003e Result\u003c(), ()\u003e {\n        let prev = self.get_cell(pos).ok_or(())?;\n        self.set_cell(pos, update(prev))\n    }\n    fn enumerate(\u0026self) -\u003e impl Iterator\u003cItem = (Pos, \u0026T)\u003e {\n        self.map.iter().enumerate().map(|(i, x)| (self.as_pos(i), x))\n    }\n}\nimpl\u003cT: Display\u003e Display for Map2D\u003cT\u003e {\n    fn fmt(\u0026self, f: \u0026mut Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        for y in 0..self.height {\n            for x in 0..self.width {\n                write!(f, \"{}\", self.map[x + self.width*y])?;\n            }\n            write!(f, \"\\n\")?;\n        }\n        Ok(())\n    }\n}\n\nfn to_offset(dir: Direction) -\u003e Offset {\n    match dir {\n        Direction::North =\u003e Offset { col: 0, row: -1},\n        Direction::East =\u003e Offset { col: 1, row: 0},\n        Direction::South =\u003e Offset { col: 0, row: 1},\n        Direction::West =\u003e Offset { col: -1, row: 0},\n    }\n}\n#[test]\nfn test_part1() {\n    let txt = read_input_file(DAY, \"demo.txt\");\n    let (wh, moves) = parse_input(\u0026txt).unwrap().1;\n    let height = wh.get_height();\n    let width = wh.width;\n    let mut robot_position = Pos {col: -1, row: -1};\n    let mut map = Map2D {\n        height,\n        width,\n        map: wh.map.iter().enumerate().map(|(i, x)| {\n            if *x == Tile::Robot {\n                robot_position = Pos {\n                    col: (i % width) as isize,\n                    row: (i / width) as isize,\n                }\n            }\n            return x;\n        }).collect(),\n    };\n    for mv in moves {\n        let offset = to_offset(mv);\n        let first = robot_position.apply_offset(\u0026offset);\n        let mut end = first;\n        while map.get_cell(\u0026end).is_some_and(|\u0026c| c == \u0026Tile::Box) {\n            end = end.apply_offset(\u0026offset);\n        }\n        match map.get_cell(\u0026end) {\n            None | Some(Tile::Wall) =\u003e {\n                // Blocked, do nothing\n            },\n            Some(Tile::Empty) =\u003e {\n                // Do push\n                map.set_cell(\u0026end, \u0026Tile::Box).expect(\"Unsuccessful write\");\n                map.set_cell(\u0026first, \u0026Tile::Empty).expect(\"Unsuccessful write\");\n                map.set_cell(\u0026robot_position, \u0026Tile::Empty).expect(\"Unsuccessful write\");\n                robot_position = first;\n            }\n            // Robot was removed from map before creation\n            // Boxes should have gotten iterated over until we found a non box tile\n            Some(Tile::Robot) | Some(Tile::Box) =\u003e panic!(\"This should be impossible\"),\n        }\n    }\n    map.set_cell(\u0026robot_position, \u0026Tile::Robot).expect(\"Unsuccessful write\");\n\n    let mut total = 0;\n    map.enumerate()\n        .filter(|(_,\u0026t)| t == \u0026Tile::Box)\n        .for_each(|(pos, _)| {\n            total += pos.col + (100 * pos.row)\n        });\n\n    assert_eq!(total, 10092);\n}\n\npub fn part1() -\u003e usize {\n    let txt = read_input_file(DAY, \"full.txt\");\n    let (wh, moves) = parse_input(\u0026txt).unwrap().1;\n    let height = wh.get_height();\n    let width = wh.width;\n    let mut robot_position = Pos {col: -1, row: -1};\n    let mut map = Map2D {\n        height,\n        width,\n        map: wh.map.iter().enumerate().map(|(i, x)| {\n            if *x == Tile::Robot {\n                robot_position = Pos {\n                    col: (i % width) as isize,\n                    row: (i / width) as isize,\n                }\n            }\n            return x;\n        }).collect(),\n    };\n    for mv in moves {\n        let offset = to_offset(mv);\n        let first = robot_position.apply_offset(\u0026offset);\n        let mut end = first;\n        while map.get_cell(\u0026end).is_some_and(|\u0026c| c == \u0026Tile::Box) {\n            end = end.apply_offset(\u0026offset);\n        }\n        match map.get_cell(\u0026end) {\n            None | Some(Tile::Wall) =\u003e {\n                // Blocked, do nothing\n            },\n            Some(Tile::Empty) =\u003e {\n                // Do push\n                map.set_cell(\u0026end, \u0026Tile::Box).expect(\"Unsuccessful write\");\n                map.set_cell(\u0026first, \u0026Tile::Empty).expect(\"Unsuccessful write\");\n                map.set_cell(\u0026robot_position, \u0026Tile::Empty).expect(\"Unsuccessful write\");\n                robot_position = first;\n            }\n            // Robot was removed from map before creation\n            // Boxes should have gotten iterated over until we found a non box tile\n            Some(Tile::Robot) | Some(Tile::Box) =\u003e pani any1 = nom::multi::many1;\n    let dir = parse_dir;\n    \n    separated_list1(line_ending, many1(dir))\n        .map(|dirs| dirs.into_iter().flatten().collect())\n        .parse(str)\n}\n/// NB: Vertical line of \u003e not part of map. Rustdoc doesn't allow starting a line with ##, even in\n/// a code block\n/// ```text\n/// \u003e #########\n/// \u003e #.....O.#\n/// \u003e ##..@...#\n/// \u003e #...OOOO#\n/// \u003e #O....O.#\n/// \u003e #.....O.#\n/// \u003e #########\n/// \u003e\n/// \u003e ^\u003c\u003c\u003c^^\u003e\u003evvvvvvv\u003e^\u003e^\n/// \u003e \u003c\u003c^vvv\u003e^\u003e\u003evv^\u003e^^vv\u003c\n/// ```\npub fn parse_input(str: \u0026str) -\u003e IResult\u003c\u0026str, (types::Warehouse, types::Instructions)\u003e {\n    let separated_pair = nom::sequence::separated_pair;\n    let line_ending = nom::character::complete::line_ending;\n    let map = parse_map;\n    let instructions = parse_instructions;\n    \n    separated_pair(map, (line_ending, line_ending), instructions)\n        .map(|(map, instructions)| (map, instructions))\n        .parse(str)\n}\n\n#[test]\nfn test_parse_input() {\n    let (map, instructions) = parse_input(\"#########\n#.....O.#\n##..@...#\n#...OOOO#\n#O....O.#\n#.....O.#\n#########\n\n^\u003c\u003c\u003c^^\u003e\u003evvvvvvv\u003e^\u003e^\n\u003c\u003c^vvv\u003e^\u003e\u003evv^\u003e^^vv\u003c\").expect(\"Should parse successfully\").1;\n    assert_eq!(*instructions.first().unwrap(), types::Direction::North);;\n    assert_eq!(*instructions.last().unwrap(), types::Direction::West);\n    assert_eq!(instructions.len(), 38);\n    \n    assert_eq!(*map.get_at(\u0026types::Point::new(2, 2)).expect(\"2,2 should be on the map\"), types::Tile::Empty);\n    assert_eq!(*map.get_at(\u0026types::Point::new(1, 2)).expect(\"1,3 should be on the map\"), types::Tile::Wall);\n    assert_eq!(*map.get_at(\u0026types::Point::new(4, 2)).expect(\"5,2 should be on the map\"), types::Tile::Robot);\n    assert_eq!(*map.get_at(\u0026types::Point::new(6, 4)).expect(\"6,4 should be on the map\"), types::Tile::Box);\n    assert_eq!(*map.get_at(\u0026types::Point::new(8, 6)).expect(\"9,7 should be on the map\"), types::Tile::Wall);\n    assert!(map.get_at(\u0026types::Point::new(8,7)).is_none());\n    assert!(map.get_at(\u0026types::Point::new(9,6)).is_none());\n    assert!(map.get_at(\u0026types::Point::new(-1,0)).is_none());\n    assert!(map.get_at(\u0026types::Point::new(0,-1)).is_none());\n}\n","traces":[{"line":6,"address":[],"length":0,"stats":{"Line":0}},{"line":7,"address":[],"length":0,"stats":{"Line":0}},{"line":8,"address":[],"length":0,"stats":{"Line":0}},{"line":9,"address":[],"length":0,"stats":{"Line":0}},{"line":23,"address":[],"length":0,"stats":{"Line":0}},{"line":24,"address":[],"length":0,"stats":{"Line":0}},{"line":25,"address":[],"length":0,"stats":{"Line":0}},{"line":26,"address":[],"length":0,"stats":{"Line":0}},{"line":28,"address":[],"length":0,"stats":{"Line":0}},{"line":29,"address":[],"length":0,"stats":{"Line":0}},{"line":30,"address":[],"length":0,"stats":{"Line":0}},{"line":32,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":45,"address":[],"length":0,"stats":{"Line":0}},{"line":46,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":49,"address":[],"length":0,"stats":{"Line":0}},{"line":51,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":69,"address":[],"length":0,"stats":{"Line":0}},{"line":70,"address":[],"length":0,"stats":{"Line":0}},{"line":71,"address":[],"length":0,"stats":{"Line":0}},{"line":72,"address":[],"length":0,"stats":{"Line": \nimpl Display for Tile {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(f, \"{}\", match self {\n            Tile::Empty =\u003e String::from(\".\"),\n            Tile::Box =\u003e String::from(\"O\"),\n            Tile::Wall =\u003e String::from(\"#\"),\n            Tile::Robot =\u003e String::from(\"@\"),\n        })\n    }\n}\n\npub type Instructions = Vec\u003cDirection\u003e;\n\n#[derive(Debug, Eq, PartialEq)]\npub struct Warehouse {\n    pub map: Vec\u003cTile\u003e,\n    pub width: usize,\n}\n\nimpl Warehouse {\n    pub fn from_2d_vec(input: Vec\u003cVec\u003cTile\u003e\u003e) -\u003e Warehouse{\n        if let Some(first) = input.iter().next() {\n            Warehouse {\n                width: first.len(),\n                map: input.into_iter().flatten().collect(),\n            }\n        } else {\n            Warehouse { map: Vec::new(), width: 0 }\n        }\n    }\n    pub fn get_height(\u0026self) -\u003e usize {\n        return self.map.len() / self.width;\n    }\n\n    pub fn get_at(\u0026self, point: \u0026Point) -\u003e Option\u003c\u0026Tile\u003e {\n        let Point { x, y } = point;\n        if *x \u003c 0 { return None }\n        if *x \u003e= self.width as isize { return None }\n        if *y \u003c 0 { return None }\n        if *y \u003e= self.get_height() as isize { return None }\n        return Some(\u0026self.map[*y as usize * self.width + *x as usize]);\n    }\n\n    fn set_at(\u0026mut self, point: \u0026Point, tile: Tile) {\n        let Point { x, y } = point;\n        if *x \u003c 0 { return }\n        if *x \u003e= self.width as isize { return }\n        if *y \u003c 0 { return }\n        if *y \u003e= self.get_height() as isize { return }\n    }\n}","traces":[{"line":9,"address":[],"length":0,"stats":{"Line":0}},{"line":25,"address":[],"length":0,"stats":{"Line":0}},{"line":26,"address":[],"length":0,"stats":{"Line":0}},{"line":27,"address":[],"length":0,"stats":{"L       Dir::West =\u003e Self { x: self.x - 1, y: self.y },\n        }\n    }\n}\n#[derive(Debug)]\nstruct Map\u003cT: Copy\u003e {\n    data: Vec\u003cT\u003e,\n    width: usize,\n}\nimpl\u003cT: Copy\u003e Map\u003cT\u003e {\n    fn height(\u0026self) -\u003e usize {\n        self.data.len() / self.width\n    }\n    fn contains_pos(\u0026self, pos: \u0026Pos) -\u003e bool {\n        0 \u003c pos.x \u0026\u0026 pos.x \u003c (self.width as i32) \u0026\u0026 0 \u003c pos.y \u0026\u0026 pos.y \u003c (self.height() as i32)\n    }\n    fn get_at(\u0026self, pos: \u0026Pos) -\u003e T {\n        self.data[pos.y as usize * self.width + pos.x as usize]\n    }\n    fn set_at(\u0026mut self, pos: \u0026Pos, val: T) {\n        self.data[pos.y as usize * self.width + pos.x as usize] = val;\n    }\n}\n\nstruct Maze {\n    start: Pos,\n    end: Pos,\n    map: Map\u003cTile\u003e\n}\n\nfn parse(str: \u0026str) -\u003e Result\u003cMaze, \u0026str\u003e {\n    let lines = str.lines();\n    let map2d: Vec\u003cVec\u003cchar\u003e\u003e = lines.map(|l| l.chars().collect()).collect();\n    let width = map2d.first().expect(\"Map should have at least one line\").len();\n    let height = map2d.len();\n\n    let mut start = None;\n    let mut end = None;\n\n    let mut data: Vec\u003cTile\u003e = Vec::with_capacity(width*height);\n    for (y, row) in map2d.iter().enumerate() {\n        for (x, \u0026ch) in row.iter().enumerate() {\n            if ch == 'S' {\n                if let Some(_) = start {\n                    return Err(\"Multiple starts found on map\")\n                }\n                start = Some(Pos { x: x as i32, y: y as i32 });\n            } else if ch == 'E' {\n                if let Some(_) = end {\n                    return Err(\"Multiple ends found on map\")\n                }\n                end = Some(Pos { x: x as i32, y: y as i32 });\n            }\n            match ch {\n                'S'|'E'|'.' =\u003e data.push(Tile::Empty),\n                '#' =\u003e data.push(Tile::Wall),\n                _ =\u003e return Err(\"Unknown character in map\")\n            }\n        }\n    }\n    if let Some(start) = start {\n        if let Some(end) = end {\n            Ok(Maze { start, end, map: Map { data, width } })\n        } else {\n            Err(\"No end found on map\")\n        }\n    } else {\n        Err(\"No start found on map\")\n    }\n}\n\n#[derive(Debug, Clone, Copy, Eq, PartialEq, Hash)]\nstruct Reindeer {\n    position: Pos,\n    direction: Dir,\n}\nimpl Reindeer {\n    const AVAILABLE_MOVES: [Cmd;3] = [Cmd::Fwd, Cmd::TurnRight, Cmd::TurnLeft];\n    fn apply(\u0026self, cmd: \u0026Cmd) -\u003e Reindeer {\n        match cmd {\n            Cmd::Fwd =\u003e Reindeer {\n                position: self.position.step(\u0026self.direction),\n                direction: self.direction,\n            },\n            Cmd::TurnRight =\u003e Reindeer {\n                position: self.position,\n                direction: self.direction.right(),\n            },\n            Cmd::TurnLeft =\u003e Reindeer {\n                position: self.position,\n                direction: self.direction.left(),\n            }\n        }\n    }\n}\n\nenum Cmd { Fwd, TurnRight, TurnLeft }\ntype Path = Vec\u003cCmd\u003e;\ntrait Cost {\n    fn cost(\u0026self) -\u003e usize;\n}\nimpl Cost for Cmd {\n    fn cost(\u0026self) -\u003e usize {\n        match self {\n            Cmd::Fwd =\u003e 1,\n            Cmd::TurnRight | Cmd::TurnLeft =\u003e 1000,\n        }\n    }\n}\nimpl Cost for Path {\n    fn cost(\u0026self) -\u003e usize {\n        self.iter().map(Cmd::cost).sum()\n    }\n}\n\nfn get_available_moves(maze: \u0026Map\u003cTile\u003e, pos: Pos, dir: Dir) -\u003e Vec\u003cCmd\u003e {\n    Reindeer::AVAILABLE_MOVES.into_iter().filter(|mv| {\n        match mv {\n            Cmd::TurnRight| Cmd::TurnLeft =\u003e true,\n            Cmd::Fwd =\u003e maze.get_at(\u0026pos.step(\u0026dir)) == Tile::Empty,\n        }\n    }).collect()\n}\n\nfn min_bound_cost(from: Pos, to:Pos) -\u003e usize {\n    let mut total = 0;\n    let x_diff = from.x.abs_diff(to.x) as usize;\n    let y_diff = from.y.abs_diff(to.y) as usize;\n    total += (x_diff + y_diff) * Cmd::Fwd.cost();\n    if x_diff \u003e 0 \u0026\u0026 y_diff \u003e 0 {\n        total += Cmd::TurnRight.cost();\n    }\n    return total;\n}\n\nfn solve_simple(maze: \u0026Maze) -\u003e Result\u003cusize, \u0026str\u003e {\n    let result = astar(\n        \u0026Reindeer { position: maze.start, direction: Dir::East },\n        |\u0026r| -\u003e Vec\u003c(Reindeer, usize)\u003e {\n            get_available_moves(\u0026maze.map, r.position, r.direction).iter().map(|m| (r.apply(m), m.cost())).collect()\n        },\n        |\u0026r| min_bound_cost(r.position, maze.end),\n        |state: \u0026Reindeer| state.position == maze.end,\n    );\n\n    if let Some(result) = result {\n        Ok(result.1)\n    } else {\n        Err(\"No solution found\")\n    }\n}\nfn solve_advanced(maze: \u0026Maze) -\u003e Result\u003cusize, \u0026str\u003e {\n    let result = astar_bag(\n        \u0026Reindeer { position: maze.start, direction: Dir::East },\n        |\u0026r| -\u003e Vec\u003c(Reindeer, usize)\u003e {\n            get_available_moves(\u0026maze.map, r.position, r.direction).iter().map(|m| (r.apply(m), m.cost())).collect()\n        },\n        |\u0026r| min_bound_cost(r.position, maze.end),\n        |state: \u0026Reindeer| state.position == maze.end,\n    );\n\n    if let Some(result) = result {\n        let paths = result.0;\n        let positions: HashSet\u003cPos\u003e = paths.flat_map(|path| path.iter().map(|n: \u0026Reindeer| n.position).collect::\u003cVec\u003cPos\u003e\u003e()).collect();\n        Ok(positions.len())\n    } else {\n        Err(\"No solution found\")\n    }\n}\n\n#[test]\nfn test_part1() {\n    let demo1 = parse(\u0026read_input_file(DAY, \"demo1.txt\")).expect(\"Failed to parse demo1.txt\");\n    let demo2 = parse(\u0026read_input_file(DAY, \"demo2.txt\")).expect(\"Failed to parse demo2.txt\");\n\n    let cost1 = solve_simple(\u0026demo1).expect(\"Problem to be solvable\");\n    let cost2 = solve_simple(\u0026demo2).expect(\"Problem to be solvable\");\n    assert_eq!(cost1, 7036);\n    assert_eq!(cost2, 11048);\n}\n\npub fn part1() -\u003e usize {\n    let full = parse(\u0026read_input_file(DAY, \"full.txt\")).expect(\"Failed to parse full.txt\");\n\n    let cost = solve_simple(\u0026full).expect(\"Problem to be solvable\");\n    return cost;\n}\n\n#[test]\nfn test_part2() {\n    let demo1 = parse(\u0026read_input_file(DAY, \"demo1.txt\")).expect(\"Failed to parse demo1.txt\");\n    let demo2 = parse(\u0026read_input_file(DAY, \"demo2.txt\")).expect(\"Failed to parse demo2.txt\");\n\n    let cost1 = solve_advanced(\u0026demo1).expect(\"Problem to be solvable\");\n    let cost2 = solve_advanced(\u0026demo2).expect(\"Problem to be solvable\");\n    assert_eq!(cost1, 45);\n    assert_eq!(cost2, 64);\n}\n\npub fn part2() -\u003e usize {\n    let full = parse(\u0026read_input_file(DAY, \"full.txt\")).expect(\"Failed to parse full.txt\");\n\n    let cost = solve_advanced(\u0026full).expect(\"Problem to be solvable\");\n    return cost;\n}","traces":[{"line":16,"address":[],"length":0,"stats":{"Line":0}},{"line":17,"address":[],"length":0,"stats":{"Line":0}},{"line":18,"address":[],"length":0,"stats":{"Line":0}},{"line":19,"address":[],"length":0,"stats":{"Line":0}},{"line":20,"address":[],"length":0,"stats":{"Line":0}},{"line":30,"address":[],"length":0,"stats":{"Line":0}},{"line":31,"address":[],"length":0,"stats":{"Line":0}},{"line":32,"address":[],"length":0,"stats":{"Line":0}},{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":34,"address":[],"length":0,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":40,"address":[],"length":0,"stats":{"Line":0}},{"line":41,"a ft [cmb](ProcessState::read_combo) bits\n    adv(u8)=0,\n    /// B = B xor OP\n    bxl(u8)=1,\n    /// B = 3 least significant bits of [cmb](ProcessState::read_combo)\n    bst(u8)=2,\n    /// Jump to OP if A != 0\n    jnz(u8)=3,\n    /// B = B xor C\n    bxc=4,\n    /// out \u003c-- 3 least significant bits of [cmb](ProcessState::read_combo)\n    out(u8)=5,\n    /// B = A shift left [cmd](ProcessState::read_combo) bits\n    bdv(u8)=6,\n    /// C = A shift left [cmd](ProcessState::read_combo) bits\n    cdv(u8)=7,\n}\nimpl TryFrom\u003c(u8, u8)\u003e for Instruction {\n    type Error = String;\n\n    fn try_from((opcode, operand): (u8, u8)) -\u003e Result\u003cSelf, Self::Error\u003e {\n        if operand \u003e 8 { return Err(String::from(\"Memory corrupt: Operand larger than 8\")); }\n        match opcode {\n            0 =\u003e Ok(Instruction::adv(operand)),\n            1 =\u003e Ok(Instruction::bxl(operand)),\n            2 =\u003e Ok(Instruction::bst(operand)),\n            3 =\u003e Ok(Instruction::jnz(operand)),\n            4 =\u003e Ok(Instruction::bxc),\n            5 =\u003e Ok(Instruction::out(operand)),\n            6 =\u003e Ok(Instruction::bdv(operand)),\n            7 =\u003e Ok(Instruction::cdv(operand)),\n            _ =\u003e Err(String::from(\"Memory corrupt: Operand larger than 8\"))\n        }\n    }\n}\n\ntype Program = Vec\u003cu8\u003e;\n\n#[derive(Debug, Clone, Hash, PartialEq, Eq)]\nstruct ProcessState\u003c'p\u003e {\n    program: \u0026'p Program,\n    program_counter: usize,\n    reg_a: isize,\n    reg_b: isize,\n    reg_c: isize,\n}\n\nimpl\u003c'p\u003e ProcessState\u003c'p\u003e {\n    fn start(program: \u0026'p Program) -\u003e Self {\n        ProcessState {\n            program,\n            program_counter: 0,\n            reg_a: 0,\n            reg_b: 0,\n            reg_c: 0,\n        }\n    }\n    fn read_combo(\u0026self, op: u8) -\u003e isize {\n       match op {\n           0|1|2|3 =\u003e op as isize,\n           4 =\u003e self.reg_a,\n           5 =\u003e self.reg_b,\n           6 =\u003e self.reg_c,\n           7 =\u003e panic!(\"Unsupported combo op 7\"),\n           _ =\u003e panic!(\"HW error: operand out of range\"),\n       }\n    }\n    fn restore_snapshot(program: \u0026'p Program, register_a: isize, register_b: isize, register_c: isize) -\u003e Self {\n        ProcessState::\u003c'p\u003e {\n            program,\n            program_counter: 0,\n            reg_a: register_a,\n            reg_b: register_b,\n            reg_c: register_c,\n        }\n    }\n    fn is_done(\u0026self) -\u003e bool {\n        self.program_counter + 1 \u003e= self.program.len()\n    }\n    fn run_tick(\u0026mut self) -\u003e Result\u003cOption\u003cu8\u003e, String\u003e {\n        if self.is_done() {\n            return Err(String::from(\"Program has already exited\"));\n        };\n        let opcode = self.program[self.program_counter];\n        let operand = self.program[self.program_counter + 1];\n        let operation = Instruction::try_from((opcode, operand))?;\n        match operation {\n            // op-using instructions\n            Instruction::adv(op) =\u003e { self.reg_a = self.reg_a / 2isize.pow(self.read_combo(op) as u32) }\n            Instruction::bdv(op) =\u003e { self.reg_b = self.reg_a / 2isize.pow(self.read_combo(op) as u32) }\n            Instruction::cdv(op) =\u003e { self.reg_c = self.reg_a / 2isize.pow(self.read_combo(op) as u32) }\n            Instruction::bxl(op) =\u003e { self.reg_b ^= op as isize; }\n            Instruction::bst(op) =\u003e { self.reg_b = self.read_combo(op) % 8; }\n            // opless instructions\n            Instruction::bxc =\u003e { self.reg_b ^= self.reg_c; }\n            // control flow instructions\n            Instruction::jnz(op) =\u003e {\n                if self.reg_a != 0 {\n                    self.program_counter = op as usize;\n                    if op \u003e= self.program.len() as u8 {\n                        return Err(String::from(\"Jump instruction exceeds program bounds\"))\n                    }\n                    return Ok(None)\n                }\n            }\n            // io instructions\n            Instruction::out(op) =\u003e {\n                let c = self.read_combo(op) % 8;\n                self.program_counter += 2;\n                return Ok(Some(c as u8));\n            }\n        }\n        self.program_counter += 2;\n        return Ok(None);\n    }\n\n    fn run_to_completion(\u0026mut self, stdout: \u0026Sender\u003cu8\u003e) -\u003e Result\u003c(), String\u003e {\n        // keep running until finished\n        while !self.is_done() {\n            if let Ok(result) = self.run_tick() {\n                if let Some(c) = result {\n                    stdout.send(c).map_err(|e| e.to_string())?;\n                }\n            }\n        }\n        return Ok(())\n    }\n}\n\n#[test]\nfn test_example_programs() {\n    let program1 = Program::from(vec!(2, 6));\n    let program2 = Program::from(vec!(5, 0, 5, 1, 5, 4));\n    let program3 = Program::from(vec!(0, 1, 5, 4, 3, 0));\n    let program4 = Program::from(vec!(1, 7));\n    let program5 = Program::from(vec!(4, 0));\n\n    let mut process1 = ProcessState::restore_snapshot(\u0026program1, 0, 0, 9);\n    let mut process2 = ProcessState::restore_snapshot(\u0026program2, 10, 0, 0);\n    let mut process3 = ProcessState::restore_snapshot(\u0026program3, 2024, 0, 0);\n    let mut process4 = ProcessState::restore_snapshot(\u0026program4, 0, 29, 0);\n    let mut process5 = ProcessState::restore_snapshot(\u0026program5, 0, 2024, 43690);\n\n    let channel1 = channel();\n    let channel2 = channel();\n    let channel3 = channel();\n    let channel4 = channel();\n    let channel5 = channel();\n    // All should run successfully\n    process1.run_to_completion(\u0026channel1.0).expect(\"Program 1 should finish\");\n    process2.run_to_completion(\u0026channel2.0).expect(\"Program 2 should finish\");\n    process3.run_to_completion(\u0026channel3.0).expect(\"Program 3 should finish\");\n    process4.run_to_completion(\u0026channel4.0).expect(\"Program 4 should finish\");\n    process5.run_to_completion(\u0026channel5.0).expect(\"Program 5 should finish\");\n\n    // Program states \u0026 outputs should be as described\n    assert_eq!(process1.reg_b, 1);\n    assert_eq!(channel2.1.try_iter().collect::\u003cVec\u003cu8\u003e\u003e(), vec!(0,1,2));\n    assert_eq!(channel3.1.try_iter().collect::\u003cVec\u003cu8\u003e\u003e(), vec!(4,2,5,6,7,7,7,7,3,1,0));\n    assert_eq!(process3.reg_a, 0);\n    assert_eq!(process4.reg_b, 26);\n    assert_eq!(process5.reg_b, 44354);\n}\n\n// fn find_reg_a_value_to_produce_a_quine(program: \u0026Program, reg_b: isize, reg_c: isize) -\u003e Result\u003cusize, String\u003e {\n//     fn program(A: u32) -\u003e u32 {\n//         let B = (A \u0026 0b111) ^ 0b101 ;\n//         let C = A.rotate_right(B) \u0026 0b111;\n//         let B = B ^ 0b110;\n//         let B = B ^ C \u0026 0b111;\n//         return B;\n//     }\n//     let a = 0usize;\n//     \n//     let cache_size = Arc::new(AtomicUsize::new(0));\n//     let current_reg_a = Arc::new(AtomicUsize::new(0));\n// \n//     thread::scope(|s| {\n//         let mut produces: HashMap\u003cProcessState, Vec\u003cu8\u003e\u003e = HashMap::new();\n//         \n//         fn get_reverse_remainder\u003c'a\u003e(produces: \u0026mut HashMap\u003cProcessState\u003c'a\u003e, Vec\u003cu8\u003e\u003e, processState: \u0026mut ProcessState\u003c'a\u003e, depth: usize) -\u003e Vec\u003cu8\u003e{\n// \n//             if depth \u003e 100 {\n//                 panic!(\"Yeah it's actually pretty deep\")\n//             }\n//             if processState.is_done() {\n//                 return vec!();\n//             }\n//             match produces.get(processState) {\n//                 Some(rem) =\u003e rem.clone(),\n//                 None =\u003e match processState.run_tick() {\n//                     Ok(Some(c)) =\u003e {\n// ress":[],"length":0,"stats":{"Line":0}},{"line":326,"address":[],"length":0,"stats":{"Line":0}},{"line":327,"address":[],"length":0,"stats":{"Line":0}},{"line":329,"address":[],"length":0,"stats":{"Line":0}},{"line":332,"address":[],"length":0,"stats":{"Line":0}},{"line":334,"address":[],"length":0,"stats":{"Line":0}},{"line":335,"address":[],"length":0,"stats":{"Line":0}},{"line":336,"address":[],"length":0,"stats":{"Line":0}},{"line":337,"address":[],"length":0,"stats":{"Line":0}},{"line":338,"address":[],"length":0,"stats":{"Line":0}},{"line":339,"address":[],"length":0,"stats":{"Line":0}},{"line":341,"address":[],"length":0,"stats":{"Line":0}},{"line":342,"address":[],"length":0,"stats":{"Line":0}},{"line":343,"address":[],"length":0,"stats":{"Line":0}},{"line":345,"address":[],"length":0,"stats":{"Line":0}},{"line":347,"address":[],"length":0,"stats":{"Line":0}},{"line":348,"address":[],"length":0,"stats":{"Line":0}},{"line":349,"address":[],"length":0,"stats":{"Line":0}},{"line":350,"address":[],"length":0,"stats":{"Line":0}},{"line":353,"address":[],"length":0,"stats":{"Line":0}},{"line":355,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":94},{"path":["C:","\\","Users","Reigo","RustroverProjects","AoC2024","src","day17","reverse.rs"],"content":"use std::sync::mpsc;\nuse std::sync::mpsc::TryRecvError;\nuse wasm_bindgen_futures::js_sys::Math::exp;\nuse super::*;\n\n/*\nMy program\n   : do {\n2 4:   B = A % 3 bits\n1 5:   B ^= 101\n7 5:   C = A \u003c\u003c B\n1 6:   B ^= 110\n4 3:   B ^= C\n5 5:   print(B)\n0 3:   A \u003c\u003c 3\n3 0: } while A != 0\n\nSimplified:\n  For every 3 bit grouping in A as GROUP, starting from least significant:\n    print(GROUP ^ 011 ^ (A \u003c\u003c (GROUP ^ 101)))\n\nHow to reverse?\nStart processing output values in reverse. Each output value determines the possible values of the current GROUP\n(groups processed this way provide bits from most to least significant)\nOn the first iteration, all offset values assumed to be 0\nOn deeper iterations, offset values depend on the values determined previously\n*/\n\nfn possible_inputs(out: u8, reg_a: u64) -\u003e Vec\u003cu8\u003e {\n    // print(GROUP ^ 011 ^ (A \u003c\u003c (GROUP ^ 101)))\n    // When doing it by hand i had a fancier method, but just to make sure i don't make an error\n    // let's just brute force it. It's only 8 possible values, the difference is trivial\n    let mut inputs = Vec::with_capacity(8);\n    for candidate in 0..8u8 {\n        let new_reg_a = (reg_a \u003c\u003c 3) + candidate as u64;\n        \n        let mut b = ((new_reg_a % 8)) as u8;\n        b ^= 0b101;\n        let c = ((new_reg_a \u003e\u003e b) % 8) as u8;\n        b ^= 0b110;\n        b ^= c;\n        if b == out {\n            inputs.push(candidate);\n        }\n    }\n    \n    return inputs;\n}\n#[test]\nfn test_possible_inputs() {\n    assert_eq!(vec!(0b011), possible_inputs(0, 0));\n    assert_eq!(vec!(0b000, 0b001, 0b101, 0b111), possible_inputs(3, 0b11));\n}\n\n// Remaining outputs from end to start\nfn decompile_sequence_recursive(mut reg_a: u64, remaining: Vec\u003cu8\u003e) -\u003e Option\u003cVec\u003cu8\u003e\u003e {\n    if remaining.is_empty() {\n        return Some(vec!());\n    } else {\n        let expect = *remaining.iter().next().unwrap();\n        let remaining: Vec\u003cu8\u003e = remaining.into_iter().skip(1).collect();\n        let candidates = possible_inputs(expect, reg_a);\n        println!(\"\\t{:b} -\u003e {:b} = {:?}\", reg_a, expect, candidates);\n        for i in candidates {\n            match decompile_sequence_recursive((reg_a \u003c\u003c 3) + i as u64, remaining.clone()) {\n                None =\u003e {  },\n                Some(mut rem) =\u003e {\n                    rem.insert(0, i);\n                    return Some(rem) // Recombine start to end\n                }\n            }\n        }\n        return None;\n    }\n}\nfn decompile_sequence(program: \u0026Program) -\u003e Option\u003cu64\u003e {\n    let expect = program.clone().into_iter().rev().collect();\n    let option = decompile_sequence_recursive(0, expect);\n    match option {\n        None =\u003e None,\n        Some(trits) =\u003e {\n            let mut out = 0u64;\n            for trit in trits {\n                out = (out \u003c\u003c 3) + trit as u64\n            }\n            Some(out)\n        }\n    }\n}\n#[test]\nfn solve_part2() {\n    let program: Vec\u003cu8\u003e = vec!(2,4,1,5,7,5,1,6,4,3,5,5,0,3,3,0);\n    let reg_a = decompile_sequence(\u0026program);\n    match reg_a {\n        Some(v) =\u003e {\n            let (sender, receiver) = mpsc::channel();\n            ProcessState::restore_snapshot(\u0026program, v as isize, 0, 0).run_to_completion(\u0026sender).unwrap();\n            println!(\"Result?\");\n            for i in program {\n                print!(\" {}\", receiver.try_recv().unwrap());\n                // assert_eq!(receiver.try_recv(), Ok(i));\n            }\n            assert_eq!(receiver.try_recv(), Err(TryRecvError::Empty));\n        },\n        None =\u003e panic!(\"Failed to find solution\")\n    }\n    println!(\"Answer: reg_a = {}\", reg_a.unwrap());\n    assert!(reg_a.unwrap() \u003c 139543356615066);\n}","traces":[{"line":29,"address":[],"length":0,"stats":{"Line":0}},{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":34,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":43,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":56,"address":[],"length":0,"stats":{"Line":0}},{"line":57,"address":[],"length":0,"stats":{"Line":0}},{"line":58,"address":[],"length":0,"stats":{"Line":0}},{"line":60,"address":[],"length":0,"stats":{"Line":0}},{"line":61,"address":[],"length":0,"stats":{"Line":0}},{"line":62,"address":[],"length":0,"stats":{"Line":0}},{"line":63,"address":[],"length":0,"stats":{"Line":0}},{"line":64,"address":[],"length":0,"stats":{"Line":0}},{"line":66,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":68,"address":[],"length":0,"stats":{"Line":0}},{"line":69,"address":[],"length":0,"stats":{"Line":0}},{"line":73,"address":[],"length":0,"stats":{"Line":0}},{"line":76,"address":[],"length":0,"stats":{"Line":0}},{"line":77,"address":[],"length":0,"stats":{"Line":0}},{"line":78,"address":[],"length":0,"stats":{"Line":0}},{"line":79,"address":[],"length":0,"stats":{"Line":0}},{"line":80,"address":[],"length":0,"stats":{"Line":0}},{"line":81,"address":[],"length":0,"stats":{"Line":0}},{"line":82,"address":[],"length":0,"stats":{"Line":0}},{"line":83,"address":[],"length":0,"stats":{"Line":0}},{"line":84,"address":[],"length":0,"stats":{"Line":0}},{"line":86,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":29},{"path":["C:","\\","Users","Reigo","RustroverProjects","AoC2024","src","day18","mod.rs"],"content":"use std::collections::HashSet;\nuse crate::utils::read_input_file;\n\nconst DAY: \u0026str = \"day18\";\n\n#[derive(Debug, Eq, PartialEq, Copy, Clone, Hash)]\nstruct Pos {\n    x: i32,\n    y: i32,\n}\n\nimpl Pos {\n    fn neighbors(\u0026self) -\u003e [Pos; 4] {\n        [\n            Self { x: self.x, y: self.y - 1 },\n            Self { x: self.x + 1, y: self.y },\n            Self { x: self.x, y: self.y + 1 },\n            Self { x: self.x - 1, y: self.y },\n        ]\n    }\n}\n#[derive(Debug)]\nstruct Map\u003cT: Copy\u003e {\n    data: Vec\u003cT\u003e,\n    width: usize,\n}\nimpl\u003cT: Copy\u003e Map\u003cT\u003e {\n    fn height(\u0026self) -\u003e usize {\n        self.data.len() / self.width\n    }\n    fn contains_pos(\u0026self, pos: \u0026Pos) -\u003e bool {\n        0 \u003c= pos.x \u0026\u0026 pos.x \u003c (self.width as i32) \u0026\u0026 0 \u003c= pos.y \u0026\u0026 pos.y \u003c (self.height() as i32)\n    }\n    fn get_at(\u0026self, pos: \u0026Pos) -\u003e T {\n        self.data[pos.y as usize * self.width + pos.x as usize]\n    }\n    fn set_at(\u0026mut self, pos: \u0026Pos, val: T) {\n        self.data[pos.y as usize * self.width + pos.x as usize] = val;\n    }\n    fn filled(width: usize, height: usize, v: \u0026T) -\u003e Self {\n        Self {\n            data: Vec::from_iter((0..width*height).map(|_| *v)),\n            width\n        }\n    }\n    fn modify_all(\u0026mut self, map: fn(v: \u0026T) -\u003e T) {\n        self.data = self.data.iter().map(map).collect()\n    }\n}\n\n/// Given the input which is a list of coordinate pairs, one on each line\n/// and the size of the map\n/// Output a map where each cell contains the time when that cell becomes corrupted (or usize::MAX if the cell will remain OK)\nfn parse_input(str: \u0026str, width: usize, height: usize) -\u003e Map\u003cusize\u003e {\n    let mut out: Map\u003cusize\u003e = Map::filled(width, height, \u0026usize::MAX);\n    str.lines().enumerate().for_each(|(i, line)| {\n        let mut split = line.split(\",\");\n        let x = split.next().expect(\"Each line should have coordinates\");\n        let y = split.next().expect(\"Each line should have a second coordinate\");\n        let x: usize = str::parse(x).expect(\"Coordinates should be valid integers\");\n        let y: usize = str::parse(y).expect(\"Coordinates should be valid integers\");\n        let pos = Pos { x: x as i32, y: y as i32 };\n        let current = out.get_at(\u0026pos);\n        if i \u003c current {\n            out.set_at(\u0026pos, i);\n        }\n    });\n    return out;\n}\n#[test]\nfn test_parse_input() {\n    let map = parse_input(\"1,1\\n1,3\\n2,2\",3, 4);\n    assert_eq!(map.data, vec!(\n        usize::MAX, usize::MAX, usize::MAX, \n        usize::MAX, 0, usize::MAX,\n        usize::MAX, usize::MAX, 2,\n        usize::MAX, 1, usize::MAX,\n    ));\n}\nfn part1_flood_fill(corruption_map: \u0026Map\u003cusize\u003e, start: \u0026Pos) -\u003e Map\u003cusize\u003e {\n    let mut distance_map: Map\u003cusize\u003e = Map::filled(corruption_map.width, corruption_map.height(), \u0026usize::MAX);\n    distance_map.set_at(start, 0);\n    let mut distance = 0;\n    let mut position = HashSet::new();\n    position.insert(*start);\n    while position.len() \u003e 0 {\n        distance += 1;\n        let mut new_position = HashSet::new();\n        for \u0026pos in \u0026position {\n            for neighbor in pos.neighbors() {\n                if distance_map.contains_pos(\u0026neighbor) {\n                    if distance \u003c distance_map.get_at(\u0026neighbor) \u0026\u0026 distance \u003c corruption_map.get_at(\u0026neighbor){\n                        distance_map.set_at(\u0026neighbor, distance);\n                        new_position.insert(neighbor);\n                    }\n                }\n            }\n        }\n        position = new_position;\n    }\n    distance_map\n}\nfn part2_flood_fill(corruption_map: \u0026Map\u003cusize\u003e, start: \u0026Pos, end: \u0026Pos) -\u003e usize {\n    let mut visibility_map: Map\u003cbool\u003e = Map::filled(corruption_map.width, corruption_map.height(), \u0026false);\n    \n    let mut front = vec!(*start);\n    let mut time = *corruption_map.data.iter().filter(|\u0026\u0026v| v \u003c usize::MAX).max().unwrap_or(\u00260);\n    loop {\n        let (stuck, free): (Vec\u003cPos\u003e, Vec\u003cPos\u003e) = front.iter().partition(|p| corruption_map.get_at(p) \u003c time);\n        // No longer able to move because of corruption, step back in time\n        if free.is_empty() {\n            if time == 0 {\n                for y in 0..visibility_map.height() {\n                    for x in 0..visibility_map.width {\n                        print!(\"{}\", if visibility_map.get_at(\u0026Pos{x: x as i32, y: y as i32}) { \".\" } else { \"#\" })\n                    }\n                    println!();\n                }\n                panic!(\"This should never happen\")\n            }\n            time -= 1;\n        } else {\n            let mut new_front = stuck;\n            for pos in free {\n                for n in pos.neighbors() {\n                    // In range\n                    if visibility_map.contains_pos(\u0026n) {\n                        // Not travelled yet\n                        if !visibility_map.get_at(\u0026n) {\n                            new_front.push(n);\n                            visibility_map.set_at(\u0026n, true);\n                            if \u0026n == end {\n                                return time;\n                            }\n                        }\n                    }\n                }\n            }\n            front = new_front\n        }\n    }\n    return time;\n}\n#[test]\nfn test_part1() {\n    let mut corruption_map = parse_input(\u0026read_input_file(DAY, \"demo.txt\"), 7, 7);\n    corruption_map.modify_all(|\u0026time| if time \u003c 12 { 0 } else { usize::MAX });\n    \n    let distance_map = part1_flood_fill(\u0026corruption_map, \u0026Pos { x: 0, y: 0 });\n    assert_eq!(distance_map.get_at(\u0026Pos{x: 6, y:6}), 22)\n}\n\npub fn part1() -\u003e usize {\n    let mut corruption_map = parse_input(\u0026read_input_file(DAY, \"full.txt\"), 71, 71);\n    corruption_map.modify_all(|\u0026time| if time \u003c 1024 { 0 } else { usize::MAX });\n\n    let distance_map = part1_flood_fill(\u0026corruption_map, \u0026Pos { x: 0, y: 0 });\n\n    return distance_map.get_at(\u0026Pos{x: 70, y: 70})\n}\n\n#[test]\nfn test_part2() {\n    let input = read_input_file(DAY, \"demo.txt\");\n    let corruption_map = parse_input(\u0026input, 7, 7);\n\n    let start = \u0026Pos { x: 0, y: 0 };\n    let end = \u0026Pos { x: 6, y: 6 };\n    let max_time = part2_flood_fill(\u0026corruption_map, start, end);\n    let max_time_2 = part2_flood_fill(\u0026corruption_map, end, start);\n    assert_eq!(max_time, max_time_2);\n    assert_eq!(input.lines().nth(max_time), Some(\"6,1\"))\n}\n\npub fn part2() -\u003e String {\n    let input = read_input_file(DAY, \"full e(\u0026demo).expect(\"Demo input should parse\").1;\n    assert_eq!(solve(\u0026input), 2)\n}\n#[test]\nfn test_part2_naive() {\n    let demo = read_input_file(\"day2\", \"demo.txt\");\n    let input = parse_file(\u0026demo).expect(\"Demo input should parse\").1;\n    assert_eq!(solve2_naive(\u0026input), 4)\n}\n#[test]\nfn test_part2() {\n    let demo = read_input_file(\"day2\", \"demo.txt\");\n    let input = parse_file(\u0026demo).expect(\"Demo input should parse\").1;\n    assert_eq!(solve2(\u0026input), 4)\n}\npub fn part1() -\u003e usize {\n    let full = read_input_file(\"day2\", \"full.txt\");\n    let input = parse_file(\u0026full).expect(\"Full input should parse\").1;\n    let solution = solve(\u0026input);\n    return solution;\n}\npub fn part2() -\u003e usize {\n    let full = read_input_file(\"day2\", \"full.txt\");\n    let input = parse_file(\u0026full).expect(\"Full input should parse\").1;\n    let solution = solve2_naive(\u0026input);\n    return solution;\n}","traces":[{"line":10,"address":[],"length":0,"stats":{"Line":0}},{"line":12,"address":[],"length":0,"stats":{"Line":0}},{"line":13,"address":[],"length":0,"stats":{"Line":0}},{"line":15,"address":[],"length":0,"stats":{"Line":0}},{"line":17,"address":[],"length":0,"stats":{"Line":0}},{"line":18,"address":[],"length":0,"stats":{"Line":0}},{"line":22,"address":[],"length":0,"stats":{"Line":0}},{"line":23,"address":[],"length":0,"stats":{"Line":0}},{"line":24,"address":[],"length":0,"stats":{"Line":0}},{"line":27,"address":[],"length":0,"stats":{"Line":0}},{"line":30,"address":[],"length":0,"stats":{"Line":0}},{"line":32,"address":[],"length":0,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":0}},{"lin tialEq, Copy, Clone, Hash)]\nstruct Pos {\n    x: i32,\n    y: i32,\n}\n\nimpl Pos {\n    fn neighbors(\u0026self) -\u003e [Pos; 4] {\n        [\n            Self { x: self.x, y: self.y - 1 },\n            Self { x: self.x + 1, y: self.y },\n            Self { x: self.x, y: self.y + 1 },\n            Self { x: self.x - 1, y: self.y },\n        ]\n    }\n    fn offset(\u0026self, dx: i32, dy: i32) -\u003e Pos {\n        Pos {\n            x: self.x + dx,\n            y: self.y + dy\n        }\n    }\n    fn get_taxicab_circle(\u0026self, distance: u16) -\u003e Vec\u003cPos\u003e {\n        let mut circle = Vec::with_capacity((distance*4) as usize);\n        let distance = distance as i32;\n        let range = -distance..=distance;\n        for y in range {\n            let x = distance - y.abs();\n            circle.push(self.offset(x,y));\n            let x = -x;\n            circle.push(self.offset(x,y));\n        }\n        return circle;\n    }\n    fn get_taxicab_disk(\u0026self, distance: u16) -\u003e Vec\u003cPos\u003e {\n        let mut circle = Vec::with_capacity(((2*distance - 1).pow(2)) as usize);\n        let distance = distance as i32;\n        let range = -distance..=distance;\n        for y in range {\n            let rem = distance - y.abs();\n            for x in -rem..=rem {\n                circle.push(self.offset(x,y))\n            }\n        }\n        return circle;\n    }\n    fn taxicab_distance(\u0026self, other: \u0026Pos) -\u003e u32 {\n        self.x.abs_diff(other.x) + self.y.abs_diff(other.y)\n    }\n}\n#[derive(Debug)]\nstruct Map\u003cT: Copy\u003e {\n    data: Vec\u003cT\u003e,\n    width: usize,\n}\nimpl\u003cT: Copy\u003e Map\u003cT\u003e {\n    fn height(\u0026self) -\u003e usize {\n        self.data.len() / self.width\n    }\n    fn contains_pos(\u0026self, pos: \u0026Pos) -\u003e bool {\n        0 \u003c= pos.x \u0026\u0026 pos.x \u003c (self.width as i32) \u0026\u0026 0 \u003c= pos.y \u0026\u0026 pos.y \u003c (self.height() as i32)\n    }\n    fn get_at(\u0026self, pos: \u0026Pos) -\u003e T {\n        self.data[pos.y as usize * self.width + pos.x as usize]\n    }\n    fn set_at(\u0026mut self, pos: \u0026Pos, val: T) {\n        self.data[pos.y as usize * self.width + pos.x as usize] = val;\n    }\n    fn update_at(\u0026mut self, pos: \u0026Pos, update: fn(prev:T) -\u003e T) {\n        let index = pos.y as usize * self.width + pos.x as usize;\n        self.data[index] = update(self.data[index]);\n    }\n    fn filled(width: usize, height: usize, v: \u0026T) -\u003e Self {\n        Self {\n            data: Vec::from_iter((0..width*height).map(|_| *v)),\n            width\n        }\n    }\n    fn modify_all(\u0026mut self, map: fn(v: \u0026T) -\u003e T) {\n        self.data = self.data.iter().map(map).collect()\n    }\n\n    fn print\u003cP: Sized+Display\u003e(\u0026self, t: fn(t:T) -\u003e P) {\n        for y in 0..self.height() {\n            for x in 0..self.width {\n                print!(\"{}\", t(self.get_at(\u0026Pos{x: x as i32, y: y as i32})))\n            }\n            println!();\n        }\n    }\n    fn print_wide\u003cP: Sized+Display\u003e(\u0026self, t: fn(t:T) -\u003e P) {\n        for y in 0..self.height() {\n            for x in 0..self.width {\n                print!(\"{:4}\", t(self.get_at(\u0026Pos{x: x as i32, y: y as i32})))\n            }\n            println!();\n        }\n    }\n}\n#[derive(Copy, Clone, Debug, Eq, PartialEq)]\nenum Tile {\n    Wall,\n    Empty\n}\n\nstruct Racetrack {\n    map: Map\u003cTile\u003e,\n    start: Pos,\n    end: Pos,\n}\n\nfn parse_input(str: \u0026str) -\u003e Racetrack {\n\n    let mut width = 0;\n    let mut start = None;\n    let mut end = None;\n\n    let mut data = Vec::new();\n    for (y, line) in str.lines().enumerate() {\n        width = line.len();\n        data.push(line);\n        for (x, c) in line.chars().enumerate() {\n            match c {\n                'S' =\u003e { start = Some(Pos {x: x as i32, y: y as i32})}\n                'E' =\u003e { end = Some(Pos {x: x as i32, y: y as i32})}\n                _ =\u003e {}\n            }\n        }\n    }\n    return Racetrack {\n        start: start.expect(\"Expected to find a start tile\"),\n        end: end.expect(\"Expected to find an end tile\"),\n        map: Map {\n            data: str.lines().map(|line| line.chars().map(|c| match c {\n                '#' =\u003e Tile::Wall,\n                _ =\u003e Tile::Empty\n            })).flatten().collect(),\n            width\n        }\n    }\n}\n\n/// Get the time-saved for every possible shortcut on the track\nfn get_shortcuts(racetrack: \u0026Racetrack, max_cheat_len: usize, min_savings: usize) -\u003e Vec\u003cusize\u003e {\n    let width = racetrack.map.width;\n    let height = racetrack.map.height();\n    let mut normally_reachable_in = Map::filled(width, height, \u0026None);\n    let mut shortcuts = Vec::new();\n\n    let mut time = 0;\n    let mut pos = racetrack.start;\n    while pos != racetrack.end {\n        // Update normally-reachable-in\n        normally_reachable_in.set_at(\u0026pos, Some(time));\n        // Update pos\n        pos = pos.neighbors().into_iter().find(|p| {\n            normally_reachable_in.get_at(\u0026p).is_none() \u0026\u0026 racetrack.map.get_at(\u0026p) == Tile::Empty\n        }).expect(\"Map should have no dead ends or loops and eventually reach the end\");\n        // update time\n        time += 1;\n\n        for pos_from in pos.get_taxicab_disk(max_cheat_len as u16) {\n            if racetrack.map.contains_pos(\u0026pos_from) {\n                if let Some(cut_time) = normally_reachable_in.get_at(\u0026pos_from) {\n                    let cheat_length = pos_from.taxicab_distance(\u0026pos);\n                    let profit = time as i64 - (cut_time + cheat_length) as i64;\n                    if min_savings as i64 \u003c= profit {\n                        shortcuts.push(profit as usize);\n                    }\n                }\n            }\n        }\n    }\n\n    return shortcuts;\n}\n#[test]\nfn test_part_1() {\n    let racetrack = parse_input(\u0026read_input_file(DAY, \"demo.txt\"));\n\n    let mut shortcuts: Vec\u003cusize\u003e = get_shortcuts(\u0026racetrack, 2, 2);\n    shortcuts.sort();\n\n    assert_eq!(shortcuts, vec!(2,2,2,2,2,2,2,2,2,2,2,2,2,2,4,4,4,4,4,4,4,4,4,4,4,4,4,4,6,6,8,8,8,8,10,10,12,12,12,20,36,38,40,64));\n}\n\npub fn part1() -\u003e usize {\n    let racetrack = parse_input(\u0026read_input_file(DAY, \"full.txt\"));\n    let shortcuts: Vec\u003cusize\u003e = get_shortcuts(\u0026racetrack, 2, 100);\n\n    let sol = shortcuts.len();\n    return sol;\n}\n\n#[test]\nfn test_part_2() {\n    let racetrack = parse_input(\u0026read_input_file(DAY, \"demo.txt\"));\n\n    let mut shortcuts: Vec\u003cusize\u003e = get_shortcuts(\u0026racetrack, 20, 50);\n    shortcuts.sort();\n\n    let mut expected = Vec::new();\n    for _ in 0..32 { expected.push(50)}\n    for _ in 0..31 { expected.push(52)}\n    for _ in 0..29 { expected.push(54)}\n    for _ in 0..39 { expected.push(56)}\n    for _ in 0..25 { expected.push(58)}\n    for _ in 0..23 { expected.push(60)}\n    for _ in 0..20 { expected.push(62)}\n    for _ in 0..19 { expected.push(64)}\n    for _ in 0..12 { expected.push(66)}\n    for _ in 0..14 { expected.push(68)}\n    for _ in 0..12 { expected.push(70)}\n    for _ in 0..22 { expected.push(72)}\n    for _ in 0..4 { expected.push(74)}\n    for _ in 0..3 { expected.push(76)}\n    \n    assert_eq!(shortcuts, expected);\n}\npub fn part2() -\u003e usize {\n    let racetrack = parse_input(\u0026read_input_file(DAY, \"full.txt\"));\n    let shortcuts: Vec\u003cusize\u003e = get_shortcuts(\u0026racetrack, 20, 100);\n\n    let sol = shortcuts.len();\n    return sol;\n}","traces":[{"line":14,"address":[],"length":0,"stats":{"Line":0}},{"line":16,"address":[],"length":0,"stats":{"Line":0}},{"line":17,"address":[],"length":0,"stats":{"Line":0}},{"line":18,"address":[],"length":0,"stats":{"Line": )]\nasync fn execute_gpu(numbers: \u0026[u32]) -\u003e Option\u003cVec\u003cu32\u003e\u003e {\n    // Instantiates instance of WebGPU\n    let instance = wgpu::Instance::default();\n\n    // `request_adapter` instantiates the general connection to the GPU\n    let adapter = instance\n        .request_adapter(\u0026wgpu::RequestAdapterOptions::default())\n        .await?;\n\n    // `request_device` instantiates the feature specific connection to the GPU, defining some parameters,\n    //  `features` being the available features.\n    let (device, queue) = adapter\n        .request_device(\n            \u0026wgpu::DeviceDescriptor {\n                label: None,\n                required_features: wgpu::Features::empty(),\n                required_limits: wgpu::Limits::downlevel_defaults(),\n                memory_hints: wgpu::MemoryHints::MemoryUsage,\n            },\n            None,\n        )\n        .await\n        .unwrap();\n\n    execute_gpu_inner(\u0026device, \u0026queue, numbers).await\n}\n\nasync fn execute_gpu_inner(\n    device: \u0026wgpu::Device,\n    queue: \u0026wgpu::Queue,\n    monkeys: \u0026[u32],\n) -\u003e Option\u003cVec\u003cu32\u003e\u003e {\n    // Loads the shader from WGSL\n    let cs_module = device.create_shader_module(wgpu::include_wgsl!(\"shader.wgsl\"));\n\n    // Gets the size in bytes of the buffer.\n    let size = size_of_val(monkeys) as wgpu::BufferAddress;\n    let size2 = 100000 * 4;\n    \n    // Instantiates buffer without data.\n    // `usage` of buffer specifies how it can be used:\n    //   `BufferUsages::MAP_READ` allows it to be read (outside the shader).\n    //   `BufferUsages::COPY_DST` allows it to be the destination of the copy.\n    let output_buffer = device.create_buffer(\u0026wgpu::BufferDescriptor {\n        label: Some(\"Output buffer\"),\n        size: size2,\n        usage: wgpu::BufferUsages::MAP_READ | wgpu::BufferUsages::COPY_DST,\n        mapped_at_creation: false,\n    });\n\n    // Instantiates buffer with data (`numbers`).\n    // Usage allowing the buffer to be:\n    //   A storage buffer (can be bound within a bind group and thus available to a shader).\n    //   The destination of a copy.\n    //   The source of a copy.\n    let monkeys_buffer = device.create_buffer_init(\u0026wgpu::util::BufferInitDescriptor {\n        label: Some(\"Monkeys Buffer\"),\n        contents: bytemuck::cast_slice(monkeys),\n        usage: wgpu::BufferUsages::STORAGE\n            | wgpu::BufferUsages::COPY_DST\n            | wgpu::BufferUsages::COPY_SRC,\n    });\n    let monkeys_len_buffer = device.create_buffer_init(\u0026wgpu::util::BufferInitDescriptor {\n        label: Some(\"Monkeys length uniform\"),\n        contents:  bytemuck::cast_slice(\u0026[monkeys.len()]),\n        usage: wgpu::BufferUsages::UNIFORM,\n    });\n    let strategies_buffer = device.create_buffer(\u0026wgpu::BufferDescriptor {\n        label: Some(\"Strategies buffer\"),\n        size: size2,\n        usage: wgpu::BufferUsages::STORAGE\n        | wgpu::BufferUsages::COPY_DST\n        | wgpu::BufferUsages::COPY_SRC,\n        mapped_at_creation: false,\n    });\n\n    // A bind group defines how buffers are accessed by shaders.\n    // It is to WebGPU what a descriptor set is to Vulkan.\n    // `binding` here refers to the `binding` of a buffer in the shader (`layout(set = 0, binding = 0) buffer`).\n\n    // Instantiates the bind group, once again specifying the binding of buffers.\n    let bind_group_layout = device.create_bind_group_layout(\u0026wgpu::BindGroupLayoutDescriptor {\n        label: None,\n        entries: \u0026[wgpu::BindGroupLayoutEntry {\n            binding: 0,\n            visibility: wgpu::ShaderStages::COMPUTE,\n            ty: wgpu::BindingType::Buffer {\n                ty: wgpu::BufferBindingType::Storage { read_only: false },\n                has_dynamic_offset: false,\n                min_binding_size: None\n            },\n            count: None,\n        }, wgpu::BindGroupLayoutEntry {\n            binding: 1,\n            visibility: wgpu::ShaderStages::COMPUTE,\n            ty: wgpu::BindingType::Buffer {\n                ty: wgpu::BufferBindingType::Storage { read_only: false },\n                has_dynamic_offset: false,\n                min_binding_size: None\n            },\n            count: None,\n        }, wgpu::BindGroupLayoutEntry {\n            binding: 2,\n            visibility: wgpu::ShaderStages::COMPUTE,\n            ty: wgpu::BindingType::Buffer {\n                ty: wgpu::BufferBindingType::Uniform,\n                has_dynamic_offset: false,\n                min_binding_size: None,\n            },\n            count: None,\n        }]\n    });\n    // A pipeline specifies the operation of a shader\n\n    // Instantiates the pipeline.\n    let compute_pipeline = device.create_compute_pipeline(\u0026wgpu::ComputePipelineDescriptor {\n        label: None,\n        layout: Some(\u0026device.create_pipeline_layout(\u0026wgpu::PipelineLayoutDescriptor {\n            label: Some(\"Pipeline layout\"),\n            bind_group_layouts: \u0026[\u0026bind_group_layout],\n            push_constant_ranges: \u0026[],\n        })),\n        module: \u0026cs_module,\n        entry_point: \"main\",\n        compilation_options: Default::default(),\n        cache: None,\n    });\n\n    // A command encoder executes one or many pipelines.\n    // It is to WebGPU what a command buffer is to Vulkan.\n    let mut encoder =\n        device.create_command_encoder(\u0026wgpu::CommandEncoderDescriptor { label: None });\n    {\n        let mut cpass = encoder.begin_compute_pass(\u0026wgpu::ComputePassDescriptor {\n            label: None,\n            timestamp_writes: None,\n        });\n        cpass.set_pipeline(\u0026compute_pipeline);\n        cpass.set_bind_group(0, \u0026device.create_bind_group(\u0026wgpu::BindGroupDescriptor {\n            label: Some(\"Data\"),\n            layout: \u0026bind_group_layout,\n            entries: \u0026[\n                wgpu::BindGroupEntry {\n                    binding: 0,\n                    resource: monkeys_buffer.as_entire_binding(),\n                },\n                wgpu::BindGroupEntry {\n                    binding: 1,\n                    resource: strategies_buffer.as_entire_binding(),\n                },\n                wgpu::BindGroupEntry {\n                    binding: 2,\n                    resource: monkeys_len_buffer.as_entire_binding(),\n                }\n            ]\n        }), \u0026[]);\n        cpass.insert_debug_marker(\"Simulate sellers\");\n        cpass.dispatch_workgroups(19*19, 19*19, 1); // Number of cells to run, the (x,y,z) size of item being processed\n    }\n    // Sets adds copy operation to command encoder.\n    // Will copy data from storage buffer on GPU to staging buffer on CPU.\n    encoder.copy_buffer_to_buffer(\u0026strategies_buffer, 0, \u0026output_buffer, 0, size2);\n\n    // Submits command encoder for processing\n    queue.submit(Some(encoder.finish()));\n\n    // Note that we're not calling `.await` here.\n    let buffer_slice = output_buffer.slice(..);\n    // Sets the buffer up for mapping, sending over the result of the mapping back to us when it is finished.\n    let (sender, receiver) = flume::bounded(1);\n    buffer_slice.map_async(wgpu::MapMode::Read, move |v| sender.send(v).unwrap());\n\n    // Poll the device in a blocking manner so that our future resolves.\n    // In an actual application, `device.poll(...)` should\n    // be called in an event loop or on another thread.\n    device.poll(wgpu::Maintain::wait()).panic_on_timeout();\n\n    // Awaits until `buffer_future` can be read from\n    if let Ok(Ok(())) = receiver.recv_async().await {\n        // Gets contents of buffer\n        let data = buffer_slice.get_mapped_range();\n        // Since contents are got in bytes, this converts these bytes back to u32\n        let result = bytemuck::cast_slice(\u0026data).to_vec();\n\n        // With t }\n    fn mix_div_prune(\u0026self, with: u32) -\u003e Self {\n        let mut nv = self.0 as u64;\n        nv ^= self.0 as u64 / with as u64;\n        nv %= Self::PRUNE_MOD as u64;\n        MonkeySecret(nv as u32)\n    }\n\n    fn next_secret(\u0026self) -\u003e Self {\n        self.mix_mul_prune(64)\n            .mix_div_prune(32)\n            .mix_mul_prune(2048)\n    }\n    fn price(\u0026self) -\u003e u32 {\n        self.0 % 10\n    }\n}\n\n#[test]\nfn test_monkey_secret() {\n    let mut a = MonkeySecret(123);\n    for expect in [15887950, 16495136, 527345, 704524, 1553684, 12683156, 11100544, 12249484, 7753432, 5908254] {\n        a = a.next_secret();\n        assert_eq!(MonkeySecret(expect), a);\n    }\n    let expectations = vec!((1, 8685429), (10,4700978), (100,15273692), (2024, 8667524));\n    for (start, expect) in expectations {\n        let mut nr = MonkeySecret(start);\n        for _ in 0..2000 {\n            nr = nr.next_secret();\n        }\n        assert_eq!(MonkeySecret(expect), nr);\n    }\n}\n\npub fn part1() -\u003e u64 {\n    let file_contents = read_input_file(DAY, \"full.txt\");\n    let mut sum: u64 = 0;\n    for line in file_contents.lines() {\n        let initial_number = str::parse(line.trim_end()).expect(\"All numbers to parse successfully\");\n        let mut nr = MonkeySecret(initial_number);\n        for _ in 0..2000 {\n            nr = nr.next_secret();\n        }\n        sum += nr.0 as u64;\n    }\n    return sum\n}\n\n#[test]\nfn test_part2_gpu() {\n    let profits = part2_run_on_gpu(vec!(1, 2, 3, 2024));\n    let max = profits.into_iter().max();\n    println!(\"{:?}\", max);\n    assert_eq!(Some(23), max);\n}\nfn part2_gpu() -\u003e u32 {\n    let file_contents = read_input_file(DAY, \"full.txt\");\n    let monkeys: Vec\u003cu32\u003e = file_contents.lines().into_iter().map(str::trim_end).map(str::parse).collect::\u003cResult\u003cVec\u003cu32\u003e, _\u003e\u003e().expect(\"To parse correctly\");\n    // println!(\"{:?}\", monkeys);\n    let profits = part2_run_on_gpu(monkeys);\n    // println!(\"{:?}\", profits);\n    if let Some(profit) = profits.iter().max() {\n        return *profit;\n    } else {\n        panic!();\n    }\n}\n\n#[test]\nfn test_part2_memory() {\n    let max = part2_memory(vec!(1, 2, 3, 2024));\n    assert_eq!(23, max);\n}\nfn part2_memory(monkeys: Vec\u003cu32\u003e) -\u003e u32 {\n    let mut total_reward_for_pattern = vec![0; 19*19*19*19];\n    for monkey in monkeys {\n        let mut reward_for_pattern = vec![0; 19*19*19*19];\n        let mut secret = MonkeySecret(monkey);\n        let mut diffs = [0,0,0,0];\n        for i in 0..2000 {\n            let prev = secret;\n            secret = secret.next_secret();\n            diffs = [diffs[1], diffs[2], diffs[3], secret.price() as i8 - prev.price() as i8];\n            if 3 \u003c i {\n                let [d,c,b,a] = [diffs[0]+9, diffs[1]+9, diffs[2]+9, diffs[3]+9];\n                let index: usize = ((a as u32) + (b as u32)*19 + (c as u32)*19*19 + (d as u32)*19*19*19) as usize;\n                if reward_for_pattern[index] == 0 {\n                    reward_for_pattern[index] = secret.price()+1\n                }\n            }\n        }\n        for (i,v) in reward_for_pattern.iter().enumerate() {\n            total_reward_for_pattern[i] += if *v == 0 { 0 } else { v-1 };\n        }\n    }\n    return total_reward_for_pattern.into_iter().max().unwrap()\n}\npub fn part2() -\u003e u32 {\n    let file_contents = read_input_file(DAY, \"full.txt\");\n    let monkeys: Vec\u003cu32\u003e = file_contents.lines().into_iter().map(str::trim_end).map(str::parse)\n        .collect::\u003cResult\u003cVec\u003cu32\u003e, _\u003e\u003e().expect(\"To parse correctly\");\n\n    let total_price = part2_memory(monkeys);\n    return total_price;\n}","traces":[{"line":15,"address":[],"length":0,"stats":{"Line":0}},{"line":16,"address":[],"length":0,"stats":{"Line":0}},{"line":17,"address":[],"length":0,"stats":{"Line":0}},{"line":18,"
